<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>সুপার ক্যালকুলেটর – অল-ইন-ওয়ান</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="super-calc">
  <div class="calc-header">
    <h1 id="appTitle">সুপার ক্যালকুলেটর — অল-ইন-ওয়ান টুলস</h1>
    <div class="lang-switch">
      <button id="langBn" class="lang-btn active">বাংলা</button>
      <button id="langEn" class="lang-btn">English</button>
    </div>
  </div>
  <div class="tabs-wrapper"><div class="tabs" id="tabsContainer"></div></div>
  <div id="panesContainer"></div>
  <div class="calc-footer">
    <span>© 2026 Milan Biswas |</span>
    <button class="contact-btn" id="openContactBtn">📩 মতামত</button>
  </div>
</div>
<div class="modal" id="contactModal">
  <div class="modal-content">
    <button class="close-modal" id="closeModalBtn">&times;</button>
    <h3 id="modalTitle">যোগাযোগ / Contact</h3>
    <form action="https://formspree.io/f/mpqowyld" method="POST">
      <input type="text" name="name" id="contactName" placeholder="আপনার নাম / Your name" required>
      <input type="email" name="email" id="contactEmail" placeholder="ইমেইল / Email" required>
      <textarea name="message" id="contactMsg" rows="3" placeholder="কোন সমস্যা বা মতামত জানান..."></textarea>
      <button type="submit" id="sendBtn">পাঠিয়ে দিন / Send</button>
    </form>
  </div>
</div>
<script src="script.js"></script>
        <a href="https://banglagolpogalaxy.github.io/portfolio/sitemap.html" style="color:#7c5cff; text-decoration:none; margin:0 8px;">🗺️ সাইটম্যাপ</a>
</body>
</html>
