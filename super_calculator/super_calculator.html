<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Super Calculator | All-in-One</title>
    <meta name="description" content="All-in-1 calculator: Basic, Geometry, EMI, BMI, Age, Profit-Loss, Unit Converters.">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-lang="en">

<div class="super-calc">
    <div class="calc-title">
        <span class="lang-en">🧮 Super Calculator — All-in-One Tools</span>
        <span class="lang-bn">🧮 সুপার ক্যালকুলেটর — অল-ইন-ওয়ান টুলস</span>
    </div>

    <!-- Language Toggle -->
    <div class="lang-toggle-wrapper">
        <button class="lang-btn active" data-lang="en">English</button>
        <button class="lang-btn" data-lang="bn">বাংলা</button>
    </div>

    <!-- Scrollable Tabs -->
    <div class="tabs-scroll">
        <div class="tabs" id="tabContainer">
            <button class="tab-btn active" data-tab="basic">🧮 <span class="lang-en">Basic</span><span class="lang-bn">সাধারণ</span></button>
            <button class="tab-btn" data-tab="flower">🌻 <span class="lang-en">Flower</span><span class="lang-bn">ফুল বাজার</span></button>
            <button class="tab-btn" data-tab="trig">📐 <span class="lang-en">Trigonometry</span><span class="lang-bn">ত্রিকোণমিতি</span></button>
            <button class="tab-btn" data-tab="geometry">📏 <span class="lang-en">Geometry</span><span class="lang-bn">পরিমিতি</span></button>
            <button class="tab-btn" data-tab="profitLoss">💰 <span class="lang-en">Profit-Loss</span><span class="lang-bn">লাভ-ক্ষতি</span></button>
            <button class="tab-btn" data-tab="age">🎂 <span class="lang-en">Age</span><span class="lang-bn">বয়স</span></button>
            <button class="tab-btn" data-tab="work">⚒️ <span class="lang-en">Work</span><span class="lang-bn">সময়-কাজ</span></button>
            <button class="tab-btn" data-tab="land">🏞️ <span class="lang-en">Land</span><span class="lang-bn">জমি</span></button>
            <button class="tab-btn" data-tab="unitLength">📏 <span class="lang-en">Length</span><span class="lang-bn">দৈর্ঘ্য</span></button>
            <button class="tab-btn" data-tab="unitVolume">🧴 <span class="lang-en">Volume</span><span class="lang-bn">আয়তন</span></button>
            <button class="tab-btn" data-tab="unitTemp">🌡️ <span class="lang-en">Temp</span><span class="lang-bn">তাপমাত্রা</span></button>
            <button class="tab-btn" data-tab="weight">⚖️ <span class="lang-en">Weight</span><span class="lang-bn">ওজন</span></button>
            <button class="tab-btn" data-tab="emi">💰 <span class="lang-en">EMI</span><span class="lang-bn">ইএমআই</span></button>
            <button class="tab-btn" data-tab="bmi">⚖️ <span class="lang-en">BMI</span><span class="lang-bn">বিএমআই</span></button>
        </div>
    </div>

    <!-- Basic Calculator -->
    <div id="basic" class="tab-pane active-pane">
        <div class="calc-display">
            <div class="expression" id="exprDisplay">0</div>
            <div class="result" id="decimalResult">= 0</div>
        </div>
        <div class="buttons">
            <button class="bracket-btn" data-char="(">(</button><button class="bracket-btn" data-char=")">)</button><button class="clear-btn" id="clearBtn">AC</button><button class="del-btn" id="delBtn">⌫</button><button class="op-btn" id="divideBtn">÷</button>
            <button class="num-btn" data-char="7">7</button><button class="num-btn" data-char="8">8</button><button class="num-btn" data-char="9">9</button><button class="op-btn" id="multiplyBtn">×</button><button class="op-btn" id="minusBtn">-</button>
            <button class="num-btn" data-char="4">4</button><button class="num-btn" data-char="5">5</button><button class="num-btn" data-char="6">6</button><button class="large-plus" id="largePlusBtn">+</button>
            <button class="num-btn" data-char="1">1</button><button class="num-btn" data-char="2">2</button><button class="num-btn" data-char="3">3</button><button class="eq-btn" id="equalBtn">=</button>
            <button class="num-btn" data-char="00">00</button><button class="num-btn" data-char="0">0</button><button class="num-btn" data-char=".">.</button>
        </div>
    </div>

    <!-- Other Tabs (Placeholder - JS will populate) -->
    <div id="flower" class="tab-pane"></div>
    <div id="trig" class="tab-pane"></div>
    <div id="geometry" class="tab-pane"></div>
    <div id="profitLoss" class="tab-pane"></div>
    <div id="age" class="tab-pane"></div>
    <div id="work" class="tab-pane"></div>
    <div id="land" class="tab-pane"></div>
    <div id="unitLength" class="tab-pane"></div>
    <div id="unitVolume" class="tab-pane"></div>
    <div id="unitTemp" class="tab-pane"></div>
    <div id="weight" class="tab-pane"></div>
    <div id="emi" class="tab-pane"></div>
    <div id="bmi" class="tab-pane"></div>

    <div class="calc-footer">
        <span>© 2026 Milan Biswas</span>
    </div>
</div>

<script src="main.js"></script>
</body>
</html>
