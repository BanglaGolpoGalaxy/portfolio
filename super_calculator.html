<script>
  (function() {
    // ট্যাব সুইচিং
    const tabs = document.querySelectorAll('.tab-btn');
    const panes = document.querySelectorAll('.tab-pane');
    tabs.forEach(btn => {
      btn.addEventListener('click', () => {
        tabs.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        panes.forEach(p => p.classList.remove('active-pane'));
        document.getElementById(btn.dataset.tab).classList.add('active-pane');
      });
    });

    // থিম টগল
    const themeToggle = document.getElementById('themeToggle');
    themeToggle.addEventListener('click', () => {
      document.body.classList.toggle('light');
      themeToggle.textContent = document.body.classList.contains('light') ? '☀️' : '🌙';
    });

    // ক্লিয়ার ট্যাব
    window.clearTab = function(id) {
      const pane = document.getElementById(id);
      if (!pane) return;
      pane.querySelectorAll('input').forEach(inp => inp.value = '');
      pane.querySelectorAll('.result-box, .unit-grid').forEach(el => el.innerHTML = '');
      if (id === 'geometry') document.getElementById('geometryResult').textContent = 'ফলাফল';
    };

    // সাধারণ ক্যালকুলেটর
    let expr = '', resetNext = false;
    const exprEl = document.getElementById('exprDisplay'), resEl = document.getElementById('decimalResult');
    const fracEl = document.getElementById('fractionResult'), termEl = document.getElementById('termCounter');
    function normalize(e) { return e.replace(/{/g,'(').replace(/}/g,')').replace(/\[/g,'(').replace(/\]/g,')').replace(/÷/g,'/').replace(/×/g,'*'); }
    function safeEval(e) { try { let r = Function('"use strict";return (' + normalize(e) + ')')(); if(isNaN(r)||!isFinite(r)) throw new Error(); return r; } catch(_) { return null; } }
    function toFraction(d, tol=1e-6) { if(isNaN(d)||!isFinite(d)) return d.toString(); if(Math.abs(d-Math.round(d))<tol) return Math.round(d).toString(); let s=d<0?-1:1, a=Math.abs(d), bn=1,bd=1,bdf=Math.abs(a-1); for(let de=1;de<=1000;de++){ let n=Math.round(a*de), df=Math.abs(a-n/de); if(df<bdf){bdf=df;bn=n;bd=de;if(bdf<tol)break;} } let fn=s*bn,fd=bd, g=(a,b)=>b?g(b,a%b):a, gg=g(Math.abs(fn),fd); fn/=gg;fd/=gg; return fd===1?fn.toString():`${fn}/${fd}`; }
    function update() { if(!expr.trim()){ exprEl.textContent='0';resEl.textContent='= 0';fracEl.textContent='ভগ্নাংশ: —';termEl.textContent='👉 0';return; } let r=safeEval(expr); if(r!==null){ let ds=r%1===0?r:r.toFixed(8).replace(/\.?0+$/,''); resEl.textContent=`= ${ds}`; fracEl.textContent=`ভগ্নাংশ: ${toFraction(r)}`; termEl.textContent=`👉 ${expr.split(/[\+\-\*\/]/).filter(t=>t.trim()&&!/^[\(\)\[\]\{\}]+$/.test(t)).length}`; } else { resEl.textContent='= ত্রুটি';fracEl.textContent='ভগ্নাংশ: —';termEl.textContent='👉 ?'; } exprEl.textContent=expr.replace(/\*/g,'×').replace(/\//g,'÷'); }
    function addChar(c) { if(resetNext&&/[\d\.]/.test(c)){expr='';resetNext=false;} expr+=c; update(); }
    function addOp(o) { if(resetNext) resetNext=false; if(expr&&!/[\+\-\*\/]$/.test(expr)){expr+=o;update();} else if(expr==='')return; else{expr=expr.slice(0,-1)+o;update();} }
    function clearAll() { expr='';resetNext=false;update(); }
    function del() { if(!resetNext){expr=expr.slice(0,-1);update();} }
    function sqrtFn() { let r=safeEval(expr); if(r!==null&&r>=0){expr=Math.sqrt(r).toString();resetNext=false;update();} else{expr='Error';update();setTimeout(clearAll,1000);} }
    function sqFn() { let r=safeEval(expr); if(r!==null){expr=(r*r).toString();resetNext=false;update();} else{expr='Error';update();setTimeout(clearAll,1000);} }
    function pctFn() { let r=safeEval(expr); if(r!==null){expr=(r/100).toString();resetNext=false;update();} }
    function equalFn() { let r=safeEval(expr); if(r!==null){expr=r.toString();resetNext=true;update();} else resEl.textContent='= ত্রুটি'; }

    document.querySelectorAll('#basic .num-btn[data-char], #basic .bracket-btn[data-char]').forEach(b => b.addEventListener('click', () => addChar(b.dataset.char)));
    document.getElementById('clearBtn').addEventListener('click', clearAll);
    document.getElementById('delBtn').addEventListener('click', del);
    document.getElementById('sqrtBtn').addEventListener('click', sqrtFn);
    document.getElementById('squareBtn').addEventListener('click', sqFn);
    document.getElementById('percentBtn').addEventListener('click', pctFn);
    document.getElementById('equalBtn').addEventListener('click', equalFn);
    document.getElementById('minusBtn').addEventListener('click', () => addOp('-'));
    document.getElementById('multiplyBtn').addEventListener('click', () => addOp('*'));
    document.getElementById('divideBtn').addEventListener('click', () => addOp('/'));
    document.getElementById('largePlusBtn').addEventListener('click', () => addOp('+'));
    update();

    // ত্রিকোণমিতি
    const trigFns = {
      sin: d => Math.sin(d*Math.PI/180), cos: d => Math.cos(d*Math.PI/180), tan: d => Math.tan(d*Math.PI/180),
      asin: v => Math.asin(v)*180/Math.PI, acos: v => Math.acos(v)*180/Math.PI, atan: v => Math.atan(v)*180/Math.PI
    };
    ['sin','cos','tan','asin','acos','atan'].forEach(fn => {
      document.getElementById(fn+'Btn').addEventListener('click', () => {
        let val = parseFloat(document.getElementById('angleDeg').value) || 0;
        let res = fn.startsWith('a') ? trigFns[fn](val) : trigFns[fn](val);
        document.getElementById('trigResultDecimal').textContent = `দশমিক: ${res.toFixed(6)}`;
        document.getElementById('trigResultFraction').textContent = `ভগ্নাংশ: ${toFraction(res)}`;
      });
    });

    // পরিমিতি
    const shapeInputs = document.getElementById('shapeInputs'), geomRes = document.getElementById('geometryResult');
    function getVal(id) { return parseFloat(document.getElementById(id)?.value) || 0; }
    function setVal(id, v) { let el = document.getElementById(id); if(el) el.value = v.toFixed(4); }

    function updateShapeFields() {
      let s = document.getElementById('shape').value;
      let fields = {
        square: [{id:'sqSide',l:'বাহু (a)'},{id:'sqArea',l:'ক্ষেত্রফল (A)'},{id:'sqPeri',l:'পরিসীমা (P)'}],
        rectangle: [{id:'recLen',l:'দৈর্ঘ্য (l)'},{id:'recWid',l:'প্রস্থ (w)'},{id:'recArea',l:'ক্ষেত্রফল (A)'},{id:'recPeri',l:'পরিসীমা (P)'}],
        rhombus: [{id:'rhoD1',l:'কর্ণ ১ (d1)'},{id:'rhoD2',l:'কর্ণ ২ (d2)'},{id:'rhoSide',l:'বাহু (a)'},{id:'rhoArea',l:'ক্ষেত্রফল (A)'},{id:'rhoPeri',l:'পরিসীমা (P)'}],
        parallelogram: [{id:'paraBase',l:'ভূমি (b)'},{id:'paraHt',l:'উচ্চতা (h)'},{id:'paraSide',l:'বাহু (a)'},{id:'paraArea',l:'ক্ষেত্রফল (A)'},{id:'paraPeri',l:'পরিসীমা (P)'}],
        trapezium: [{id:'trapA',l:'সমান্তরাল ১ (a)'},{id:'trapB',l:'সমান্তরাল ২ (b)'},{id:'trapH',l:'উচ্চতা (h)'},{id:'trapArea',l:'ক্ষেত্রফল (A)'}],
        irregular_quad: [{id:'irrA',l:'বাহু ১ (a)'},{id:'irrB',l:'বাহু ২ (b)'},{id:'irrC',l:'বাহু ৩ (c)'},{id:'irrD',l:'বাহু ৪ (d)'},{id:'irrDiag',l:'কর্ণ (diag)'}],
        circle: [{id:'cirRad',l:'ব্যাসার্ধ (r)'},{id:'cirDia',l:'ব্যাস (d)'},{id:'cirCir',l:'পরিধি (C)'},{id:'cirArea',l:'ক্ষেত্রফল (A)'}],
        sector: [{id:'secRad',l:'ব্যাসার্ধ (r)'},{id:'secAngle',l:'কোণ (θ°)'},{id:'secArc',l:'চাপ (l)'},{id:'secArea',l:'ক্ষেত্রফল (A)'}],
        cube: [{id:'cubeSide',l:'বাহু (a)'},{id:'cubeVol',l:'আয়তন (V)'},{id:'cubeTSA',l:'সমগ্র তল (TSA)'},{id:'cubeCSA',l:'পার্শ্ব তল (CSA)'},{id:'cubeDiag',l:'কর্ণ (d)'}],
        cuboid: [{id:'cubLen',l:'দৈর্ঘ্য (l)'},{id:'cubWid',l:'প্রস্থ (w)'},{id:'cubHt',l:'উচ্চতা (h)'},{id:'cubVol',l:'আয়তন (V)'},{id:'cubTSA',l:'সমগ্র তল (TSA)'},{id:'cubCSA',l:'পার্শ্ব তল (CSA)'},{id:'cubDiag',l:'কর্ণ (d)'}],
        sphere: [{id:'sphRad',l:'ব্যাসার্ধ (r)'},{id:'sphVol',l:'আয়তন (V)'},{id:'sphArea',l:'পৃষ্ঠতল (A)'}],
        cone: [{id:'coneRad',l:'ব্যাসার্ধ (r)'},{id:'coneHt',l:'উচ্চতা (h)'},{id:'coneSlant',l:'তির্যক উচ্চতা (l)'},{id:'coneVol',l:'আয়তন (V)'},{id:'coneTSA',l:'সমগ্র তল (TSA)'}],
        frustum: [{id:'frusR',l:'ব্যাসার্ধ ১ (R)'},{id:'frusr',l:'ব্যাসার্ধ ২ (r)'},{id:'frusH',l:'উচ্চতা (h)'},{id:'frusL',l:'তির্যক উচ্চতা (l)'},{id:'frusVol',l:'আয়তন (V)'}],
        cylinder: [{id:'cylRad',l:'ব্যাসার্ধ (r)'},{id:'cylHt',l:'উচ্চতা (h)'},{id:'cylVol',l:'আয়তন (V)'},{id:'cylTSA',l:'সমগ্র তল (TSA)'},{id:'cylCSA',l:'পার্শ্ব তল (CSA)'}],
        right_triangle: [{id:'triA',l:'লম্ব (a)'},{id:'triB',l:'ভূমি (b)'},{id:'triC',l:'অতিভুজ (c)'},{id:'triArea',l:'ক্ষেত্রফল (A)'},{id:'triPeri',l:'পরিসীমা (P)'}]
      };
      shapeInputs.innerHTML = '';
      (fields[s]||[]).forEach(f => {
        const div = document.createElement('div'); div.className = 'input-group';
        div.innerHTML = `<label>${f.l}</label><input type="number" id="${f.id}" step="any">`;
        shapeInputs.appendChild(div);
      });
    }
    updateShapeFields();
    document.getElementById('shape').addEventListener('change', updateShapeFields);

    function computeGeometry(shape, v) {
      let res = '';
      if (shape === 'square') {
        let a=v.sqSide, A=v.sqArea, P=v.sqPeri;
        if(a){ A=a*a; P=4*a; setVal('sqArea',A); setVal('sqPeri',P); res=`a=${a}, A=${A}, P=${P}`; }
        else if(A){ a=Math.sqrt(A); P=4*a; setVal('sqSide',a); setVal('sqPeri',P); res=`A=${A}, a=${a.toFixed(2)}, P=${P.toFixed(2)}`; }
        else if(P){ a=P/4; A=a*a; setVal('sqSide',a); setVal('sqArea',A); res=`P=${P}, a=${a.toFixed(2)}, A=${A.toFixed(2)}`; }
      }
      else if (shape === 'rectangle') {
        let l=v.recLen, w=v.recWid, A=v.recArea, P=v.recPeri;
        if(l&&w){ A=l*w; P=2*(l+w); setVal('recArea',A); setVal('recPeri',P); res=`l=${l}, w=${w}, A=${A}, P=${P}`; }
        else if(l&&A){ w=A/l; P=2*(l+w); setVal('recWid',w); setVal('recPeri',P); res=`l=${l}, A=${A}, w=${w.toFixed(2)}, P=${P.toFixed(2)}`; }
        else if(w&&A){ l=A/w; P=2*(l+w); setVal('recLen',l); setVal('recPeri',P); res=`w=${w}, A=${A}, l=${l.toFixed(2)}, P=${P.toFixed(2)}`; }
        else if(l&&P){ w=P/2-l; A=l*w; setVal('recWid',w); setVal('recArea',A); res=`l=${l}, P=${P}, w=${w.toFixed(2)}, A=${A.toFixed(2)}`; }
        else if(w&&P){ l=P/2-w; A=l*w; setVal('recLen',l); setVal('recArea',A); res=`w=${w}, P=${P}, l=${l.toFixed(2)}, A=${A.toFixed(2)}`; }
      }
      else if (shape === 'rhombus') {
        let d1=v.rhoD1, d2=v.rhoD2, a=v.rhoSide, A=v.rhoArea, P=v.rhoPeri;
        if(d1&&d2){ A=(d1*d2)/2; a=Math.sqrt((d1/2)**2+(d2/2)**2); P=4*a; setVal('rhoArea',A); setVal('rhoSide',a); setVal('rhoPeri',P); res=`d1=${d1}, d2=${d2}, A=${A.toFixed(2)}, a=${a.toFixed(2)}, P=${P.toFixed(2)}`; }
        else res='বাহু ও ক্ষেত্রফল থেকে কর্ণ বের করা যায় না';
      }
      else if (shape === 'parallelogram') {
        let b=v.paraBase, h=v.paraHt, a=v.paraSide, A=v.paraArea, P=v.paraPeri;
        if(b&&h){ A=b*h; setVal('paraArea',A); res=`b=${b}, h=${h}, A=${A}`; if(a){ P=2*(b+a); setVal('paraPeri',P); res+=`, P=${P}`; } }
        else if(b&&A){ h=A/b; setVal('paraHt',h); res=`b=${b}, A=${A}, h=${h.toFixed(2)}`; }
        else if(h&&A){ b=A/h; setVal('paraBase',b); res=`h=${h}, A=${A}, b=${b.toFixed(2)}`; }
      }
      else if (shape === 'trapezium') {
        let a=v.trapA, b=v.trapB, h=v.trapH, A=v.trapArea;
        if(a&&b&&h){ A=((a+b)*h)/2; setVal('trapArea',A); res=`a=${a}, b=${b}, h=${h}, A=${A}`; }
        else if(a&&b&&A){ h=2*A/(a+b); setVal('trapH',h); res=`a=${a}, b=${b}, A=${A}, h=${h.toFixed(2)}`; }
        else if(a&&h&&A){ b=2*A/h - a; setVal('trapB',b); res=`a=${a}, h=${h}, A=${A}, b=${b.toFixed(2)}`; }
      }
      else if (shape === 'irregular_quad') {
        let a=v.irrA, b=v.irrB, c=v.irrC, d=v.irrD, diag=v.irrDiag;
        if(a&&b&&c&&d&&diag){ let s1=(a+b+diag)/2, A1=Math.sqrt(s1*(s1-a)*(s1-b)*(s1-diag)); let s2=(c+d+diag)/2, A2=Math.sqrt(s2*(s2-c)*(s2-d)*(s2-diag)); res=`ক্ষেত্রফল ≈ ${(A1+A2).toFixed(4)}`; }
        else res='পাঁচটি মান প্রয়োজন';
      }
      else if (shape === 'circle') {
        let r=v.cirRad, d=v.cirDia, C=v.cirCir, A=v.cirArea;
        if(r){ d=2*r; C=2*Math.PI*r; A=Math.PI*r*r; setVal('cirDia',d); setVal('cirCir',C); setVal('cirArea',A); res=`r=${r}, d=${d.toFixed(2)}, C=${C.toFixed(2)}, A=${A.toFixed(2)}`; }
        else if(d){ r=d/2; C=Math.PI*d; A=Math.PI*r*r; setVal('cirRad',r); setVal('cirCir',C); setVal('cirArea',A); res=`d=${d}, r=${r.toFixed(2)}, C=${C.toFixed(2)}, A=${A.toFixed(2)}`; }
        else if(C){ r=C/(2*Math.PI); d=2*r; A=Math.PI*r*r; setVal('cirRad',r); setVal('cirDia',d); setVal('cirArea',A); res=`C=${C}, r=${r.toFixed(2)}, d=${d.toFixed(2)}, A=${A.toFixed(2)}`; }
        else if(A){ r=Math.sqrt(A/Math.PI); d=2*r; C=2*Math.PI*r; setVal('cirRad',r); setVal('cirDia',d); setVal('cirCir',C); res=`A=${A}, r=${r.toFixed(2)}, d=${d.toFixed(2)}, C=${C.toFixed(2)}`; }
      }
      else if (shape === 'sector') {
        let r=v.secRad, ang=v.secAngle, arc=v.secArc, A=v.secArea;
        if(r&&ang){ arc=(ang/360)*2*Math.PI*r; A=(ang/360)*Math.PI*r*r; setVal('secArc',arc); setVal('secArea',A); res=`r=${r}, θ=${ang}°, l=${arc.toFixed(2)}, A=${A.toFixed(2)}`; }
        else if(r&&arc){ ang=(arc/(2*Math.PI*r))*360; A=(ang/360)*Math.PI*r*r; setVal('secAngle',ang); setVal('secArea',A); res=`r=${r}, l=${arc}, θ=${ang.toFixed(2)}°, A=${A.toFixed(2)}`; }
      }
      else if (shape === 'cube') {
        let a=v.cubeSide, V=v.cubeVol, TSA=v.cubeTSA, CSA=v.cubeCSA, diag=v.cubeDiag;
        if(a){ V=a**3; TSA=6*a*a; CSA=4*a*a; diag=a*Math.sqrt(3); setVal('cubeVol',V); setVal('cubeTSA',TSA); setVal('cubeCSA',CSA); setVal('cubeDiag',diag); res=`a=${a}, V=${V}, TSA=${TSA}, CSA=${CSA}, d=${diag.toFixed(2)}`; }
        else if(V){ a=Math.cbrt(V); TSA=6*a*a; CSA=4*a*a; diag=a*Math.sqrt(3); setVal('cubeSide',a); setVal('cubeTSA',TSA); setVal('cubeCSA',CSA); setVal('cubeDiag',diag); res=`V=${V}, a=${a.toFixed(2)}, TSA=${TSA.toFixed(2)}, CSA=${CSA.toFixed(2)}, d=${diag.toFixed(2)}`; }
      }
      else if (shape === 'cuboid') {
        let l=v.cubLen, w=v.cubWid, h=v.cubHt, V=v.cubVol, TSA=v.cubTSA, CSA=v.cubCSA, diag=v.cubDiag;
        if(l&&w&&h){ V=l*w*h; TSA=2*(l*w+w*h+h*l); CSA=2*h*(l+w); diag=Math.sqrt(l*l+w*w+h*h); setVal('cubVol',V); setVal('cubTSA',TSA); setVal('cubCSA',CSA); setVal('cubDiag',diag); res=`l=${l}, w=${w}, h=${h}, V=${V}, TSA=${TSA}, CSA=${CSA}, d=${diag.toFixed(2)}`; }
      }
      else if (shape === 'sphere') {
        let r=v.sphRad, V=v.sphVol, A=v.sphArea;
        if(r){ V=(4/3)*Math.PI*r**3; A=4*Math.PI*r*r; setVal('sphVol',V); setVal('sphArea',A); res=`r=${r}, V=${V.toFixed(2)}, A=${A.toFixed(2)}`; }
        else if(V){ r=Math.cbrt((3*V)/(4*Math.PI)); A=4*Math.PI*r*r; setVal('sphRad',r); setVal('sphArea',A); res=`V=${V}, r=${r.toFixed(2)}, A=${A.toFixed(2)}`; }
      }
      else if (shape === 'cone') {
        let r=v.coneRad, h=v.coneHt, l=v.coneSlant, V=v.coneVol, TSA=v.coneTSA;
        if(r&&h){ l=Math.sqrt(r*r+h*h); V=(1/3)*Math.PI*r*r*h; TSA=Math.PI*r*(r+l); setVal('coneSlant',l); setVal('coneVol',V); setVal('coneTSA',TSA); res=`r=${r}, h=${h}, l=${l.toFixed(2)}, V=${V.toFixed(2)}, TSA=${TSA.toFixed(2)}`; }
      }
      else if (shape === 'frustum') {
        let R=v.frusR, r=v.frusr, h=v.frusH, L=v.frusL, V=v.frusVol;
        if(R&&r&&h){ L=Math.sqrt((R-r)**2 + h*h); V=(1/3)*Math.PI*h*(R*R + r*r + R*r); setVal('frusL',L); setVal('frusVol',V); res=`R=${R}, r=${r}, h=${h}, L=${L.toFixed(2)}, V=${V.toFixed(2)}`; }
      }
      else if (shape === 'cylinder') {
        let r=v.cylRad, h=v.cylHt, V=v.cylVol, TSA=v.cylTSA, CSA=v.cylCSA;
        if(r&&h){ V=Math.PI*r*r*h; TSA=2*Math.PI*r*(r+h); CSA=2*Math.PI*r*h; setVal('cylVol',V); setVal('cylTSA',TSA); setVal('cylCSA',CSA); res=`r=${r}, h=${h}, V=${V.toFixed(2)}, TSA=${TSA.toFixed(2)}, CSA=${CSA.toFixed(2)}`; }
      }
      else if (shape === 'right_triangle') {
        let a=v.triA, b=v.triB, c=v.triC, A=v.triArea, P=v.triPeri;
        if(a&&b){ c=Math.sqrt(a*a+b*b); A=0.5*a*b; P=a+b+c; setVal('triC',c); setVal('triArea',A); setVal('triPeri',P); res=`a=${a}, b=${b}, c=${c.toFixed(2)}, A=${A}, P=${P.toFixed(2)}`; }
        else if(a&&c){ b=Math.sqrt(c*c - a*a); A=0.5*a*b; P=a+b+c; setVal('triB',b); setVal('triArea',A); setVal('triPeri',P); }
      }
      return res;
    }

    document.getElementById('calcShapeBtn').addEventListener('click', () => {
      let s = document.getElementById('shape').value;
      let vals = {};
      shapeInputs.querySelectorAll('input').forEach(inp => vals[inp.id] = parseFloat(inp.value) || 0);
      let result = computeGeometry(s, vals);
      geomRes.innerHTML = result || 'গণনা সম্ভব নয়';
    });

    // লাভ-ক্ষতি
    document.getElementById('simplePLBtn').addEventListener('click', () => {
      let cp=parseFloat(document.getElementById('cp').value)||0, sp=parseFloat(document.getElementById('sp').value)||0;
      if(!cp||!sp){ document.getElementById('simplePLResult').textContent='CP ও SP দিন'; return; }
      let diff=sp-cp, percent=(diff/cp)*100;
      document.getElementById('simplePLResult').textContent=`${diff>=0?'লাভ':'ক্ষতি'}: ${Math.abs(diff).toFixed(2)} টাকা (${Math.abs(percent).toFixed(2)}%)`;
    });
    document.getElementById('offerPLBtn').addEventListener('click', () => {
      let t1=parseFloat(document.getElementById('offerT1').value)||0, q1=parseFloat(document.getElementById('offerQ1').value)||0;
      let t2=parseFloat(document.getElementById('offerT2').value)||0, q2=parseFloat(document.getElementById('offerQ2').value)||0;
      if(!t1||!q1||!t2||!q2){ document.getElementById('offerPLResult').textContent='সব ফিল্ড পূরণ করুন'; return; }
      let cpPerItem=t1/q1, spPerItem=t2/q2, totalCP=cpPerItem*q2, totalSP=t2;
      let diff=totalSP-totalCP, percent=(diff/totalCP)*100;
      document.getElementById('offerPLResult').textContent=`${diff>=0?'লাভ':'ক্ষতি'}: ${Math.abs(diff).toFixed(2)} টাকা (${Math.abs(percent).toFixed(2)}%)`;
    });

    // বয়স
    document.getElementById('ageBtn').addEventListener('click', () => {
      let birth=document.getElementById('birthDate').value;
      if(!birth){ document.getElementById('ageResult').textContent='জন্ম তারিখ দিন'; return; }
      let now=new Date(), bDate=new Date(birth), years=now.getFullYear()-bDate.getFullYear(), months=now.getMonth()-bDate.getMonth(), days=now.getDate()-bDate.getDate();
      if(days<0){ months--; days+=new Date(now.getFullYear(), now.getMonth(), 0).getDate(); }
      if(months<0){ years--; months+=12; }
      document.getElementById('ageResult').textContent=`${years} বছর, ${months} মাস, ${days} দিন`;
    });

    // সময়-কাজ
    document.getElementById('workBtn').addEventListener('click', () => {
      let m1=parseFloat(document.getElementById('workM1').value)||0, d1=parseFloat(document.getElementById('workD1').value)||0, w1=parseFloat(document.getElementById('workW1').value)||0;
      let m2=parseFloat(document.getElementById('workM2').value)||0, d2=parseFloat(document.getElementById('workD2').value)||0, w2=parseFloat(document.getElementById('workW2').value)||0;
      if(!m1||!d1){ document.getElementById('workResult').textContent='M1 ও D1 আবশ্যক'; return; }
      let unitWork=(m1*d1)/(w1||1);
      if(m2&&d2){ document.getElementById('workResult').textContent=`W2 = ${((m2*d2)/unitWork).toFixed(2)}`; }
      else if(m2&&w2){ document.getElementById('workResult').textContent=`D2 = ${((unitWork*w2)/m2).toFixed(2)} দিন`; }
      else if(d2&&w2){ document.getElementById('workResult').textContent=`M2 = ${((unitWork*w2)/d2).toFixed(2)} লোক`; }
      else { document.getElementById('workResult').textContent='M2, D2, W2 এর যেকোনো দুইটি দিন'; }
    });

    // জমির পরিমাপ
    const landUnits = { shotangsho: 435.6, katha: 720, bigha: 14400, acre: 43560, sqft: 1, sqm: 10.764, sqyd: 9 };
const landLabels = { shotangsho: 'শতাংশ', katha: 'কাঠা', bigha: 'বিঘা', acre: 'একর', sqft: 'বর্গফুট', sqm: 'বর্গমিটার', sqyd: 'বর্গগজ' };
document.getElementById('convertLandBtn').addEventListener('click', () => {
  let val = parseFloat(document.getElementById('landValue').value) || 0;
  let unit = document.getElementById('landUnit').value;
  if (!val) return;
  let sqft = val * (landUnits[unit] || 1);
  let html = '';
  for (let [key, factor] of Object.entries(landUnits)) {
    html += `<div class="unit-item"><span>${(sqft/factor).toFixed(4)}</span>${landLabels[key] || key}</div>`;
  }
  document.getElementById('landResults').innerHTML = html;
});
    // ইউনিট কনভার্টার (বাংলা লেবেল সহ)
    const lengthLabels = { m:'মিটার', cm:'সেমি', mm:'মিমি', km:'কিমি', in:'ইঞ্চি', ft:'ফুট', yd:'গজ' };
    const volumeLabels = { l:'লিটার', ml:'মিলিলিটার', m3:'ঘনমিটার', gal:'গ্যালন' };
    const weightLabels = { kg:'কেজি', g:'গ্রাম', lb:'পাউন্ড', oz:'আউন্স', t:'টন', mt:'মেট্রিক টন' };
    const tempLabels = { c:'সেলসিয়াস', f:'ফারেনহাইট', k:'কেলভিন' };

    const unitData = {
      length: {m:1,cm:0.01,mm:0.001,km:1000,in:0.0254,ft:0.3048,yd:0.9144},
      volume: {l:1,ml:0.001,m3:1000,gal:3.78541},
      weight: {kg:1,g:0.001,lb:0.453592,oz:0.0283495,t:1000,mt:1000}
    };
    function convertUnit(category, val, fromUnit) {
      let table = unitData[category];
      let base = val * table[fromUnit];
      let result = {};
      for (let [unit, factor] of Object.entries(table)) result[unit] = (base / factor).toFixed(4);
      return result;
    }
    function populateGrid(containerId, data, labels) {
      let html = '';
      for (let [unit, value] of Object.entries(data)) html += `<div class="unit-item"><span>${value}</span>${labels[unit]||unit}</div>`;
      document.getElementById(containerId).innerHTML = html;
    }

    document.getElementById('convertLengthBtn').addEventListener('click', ()=>{
      let val=parseFloat(document.getElementById('lengthValue').value)||0, from=document.getElementById('lengthUnit').value;
      populateGrid('lengthResults', convertUnit('length', val, from), lengthLabels);
    });
    document.getElementById('convertVolumeBtn').addEventListener('click', ()=>{
      let val=parseFloat(document.getElementById('volumeValue').value)||0, from=document.getElementById('volumeUnit').value;
      populateGrid('volumeResults', convertUnit('volume', val, from), volumeLabels);
    });
    document.getElementById('convertWeightBtn').addEventListener('click', ()=>{
      let val=parseFloat(document.getElementById('weightVal').value)||0, from=document.getElementById('weightUnit').value;
      populateGrid('weightResults', convertUnit('weight', val, from), weightLabels);
    });
    document.getElementById('convertTempBtn').addEventListener('click', ()=>{
      let val=parseFloat(document.getElementById('tempValue').value)||0, from=document.getElementById('tempUnit').value;
      let celsius = val;
      if(from==='f') celsius=(val-32)*5/9;
      else if(from==='k') celsius=val-273.15;
      let results = { c: celsius.toFixed(2), f: (celsius*9/5+32).toFixed(2), k: (celsius+273.15).toFixed(2) };
      let html = '';
      for(let [unit,value] of Object.entries(results)) html += `<div class="unit-item"><span>${value}</span>${tempLabels[unit]}</div>`;
      document.getElementById('tempResults').innerHTML = html;
    });

    // ফুল বাজার (সংশোধিত)
    document.getElementById('flowerBtn').addEventListener('click', () => {
      let total = parseFloat(document.getElementById('flowerTotal').value) || 0;
      let bagWt = parseFloat(document.getElementById('flowerBag').value) || 0;
      let waste = parseFloat(document.getElementById('flowerWaste').value) || 0;
      let price = parseFloat(document.getElementById('flowerPrice').value) || 0;
      let netWeight = Math.max(0, total - bagWt - waste);
      let totalPrice = netWeight * price;
      document.getElementById('flowerResult').textContent = `নিট ওজন: ${netWeight.toFixed(2)} কেজি | মোট মূল্য: ${totalPrice.toFixed(2)} টাকা`;
    });

    // ইএমআই
    function emiPMT(P,R,N) { if(R===0) return P/N; let r=R/1200; return (P*r*Math.pow(1+r,N))/(Math.pow(1+r,N)-1); }
    document.getElementById('emiBtn').addEventListener('click', () => {
      let P=parseFloat(document.getElementById('emiPrincipal').value)||0, R=parseFloat(document.getElementById('emiRate').value)||0;
      let M=parseFloat(document.getElementById('emiMonthly').value)||0, N=parseFloat(document.getElementById('emiMonths').value)||0;
      if(P&&R&&N){ let emi=emiPMT(P,R,N); let total=emi*N; let interest=total-P; document.getElementById('emiResult').textContent=`মাসিক কিস্তি: ${emi.toFixed(2)} টাকা, মোট পরিশোধ: ${total.toFixed(2)} টাকা, মোট সুদ: ${interest.toFixed(2)} টাকা`; }
      else if(P&&R&&M){ let r=R/1200; if(M<=P*r){ document.getElementById('emiResult').textContent='কিস্তি খুব কম'; return; } let n=Math.log(M/(M-P*r))/Math.log(1+r); let months=Math.ceil(n); let total=M*months; let interest=total-P; document.getElementById('emiResult').textContent=`সময়: ${months} মাস, মোট পরিশোধ: ${total.toFixed(2)} টাকা, মোট সুদ: ${interest.toFixed(2)} টাকা`; }
      else { document.getElementById('emiResult').textContent='P, R, N অথবা P, R, M দিন'; }
    });

    // BMI
    document.getElementById('bmiBtn').addEventListener('click', () => {
      let h=parseFloat(document.getElementById('bmiHeight').value)/100, w=parseFloat(document.getElementById('bmiWeight').value)||0;
      if(!h||!w) return;
      let bmi=w/(h*h);
      let cat=bmi<18.5?'কম ওজন':bmi<25?'স্বাভাবিক':bmi<30?'অতিরিক্ত ওজন':'স্থূলতা';
      document.getElementById('bmiResult').textContent=`BMI: ${bmi.toFixed(1)} (${cat})`;
    });

    // কন্টাক্ট মোডাল
    let modal = document.getElementById('contactModal');
    document.getElementById('openContactBtn').addEventListener('click', ()=> modal.classList.add('show'));
    document.getElementById('closeModalBtn').addEventListener('click', ()=> modal.classList.remove('show'));
    window.addEventListener('click', (e)=>{ if(e.target===modal) modal.classList.remove('show'); });
  })();
</script>
</body>
