<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>সুপার ক্যালকুলেটর | অল-ইন-ওয়ান টুলস</title>
  <meta name="description" content="প্রিমিয়াম অল-ইন-ওয়ান ক্যালকুলেটর – সাধারণ, ত্রিকোণমিতি, পরিমিতি, ইউনিট কনভার্টার, EMI, BMI, ফুল বাজার। অফলাইনে কাজ করে।">
  <meta name="keywords" content="ক্যালকুলেটর, ব্র্যাকেট ক্যালকুলেটর, ভগ্নাংশ, ত্রিকোণমিতি, জ্যামিতি, ইউনিট কনভার্টার, EMI, BMI">
  <meta name="author" content="মিলন বিশ্বাস">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="সুপার ক্যালকুলেটর – মিলন বিশ্বাস">
  <meta property="og:description" content="একাধিক ক্যালকুলেটর ও কনভার্টার এক জায়গায়। সম্পূর্ণ ফ্রি ও অফলাইন।">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://banglagolpogalaxy.github.io/avatar.png">
  <link rel="canonical" href="https://banglagolpogalaxy.github.io/portfolio/super_calculator.html">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
    body { background: #0a0f1c; font-family: 'Segoe UI', 'Poppins', system-ui, monospace; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 12px; }
    .super-calc { max-width: 550px; width: 100%; background: #0f172a; border-radius: 40px; padding: 20px; box-shadow: 0 25px 45px -12px rgba(0,0,0,0.6); border: 1px solid #1e293b; }
    .tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .tab-btn { background: #1e293b; border: none; color: #cbd5e1; padding: 6px 12px; border-radius: 40px; cursor: pointer; font-size: 0.7rem; font-weight: 600; transition: 0.2s; }
    .tab-btn.active { background: #3b82f6; color: white; }
    .tab-pane { display: none; }
    .tab-pane.active-pane { display: block; }
    /* ক্যালকুলেটর ডিসপ্লে */
    .calc-display { background: #020617; border-radius: 28px; padding: 20px; margin-bottom: 20px; text-align: right; box-shadow: inset 0 2px 6px rgba(0,0,0,0.4); }
    .term-counter { font-size: 0.75rem; color: #facc15; text-align: left; margin-bottom: 8px; }
    .expression { font-size: 1.8rem; color: #f8fafc; font-weight: 500; min-height: 2.8rem; font-family: monospace; word-break: break-all; letter-spacing: 1px; }
    .result { font-size: 2rem; font-weight: bold; color: #38bdf8; word-break: break-all; margin-top: 8px; }
    .fraction-result { font-size: 0.85rem; color: #facc15; margin-top: 8px; text-align: left; }
    /* বাটন গ্রিড – ৫ কলাম */
    .buttons { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; position: relative; }
    button { border: none; padding: 14px 0; border-radius: 28px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.05s linear; background: #1e293b; color: white; }
    button:active { transform: scale(0.96); }
    .num-btn { background: #0f172a; color: white; }
    .bracket-btn { background: #3b82f6; color: white; }
    .op-btn { background: #f97316; color: #0f172a; }
    .clear-btn { background: #ef4444; color: white; }
    .del-btn, .sqrt-btn, .square-btn, .percent-btn { background: #334155; color: white; }
    .eq-btn { background: #10b981; color: white; grid-column: span 2; }
    .large-plus {
      background: #f97316;
      color: #0f172a;
      grid-row: span 2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      border-radius: 28px;
      cursor: pointer;
    }
    /* অন্যান্য ট্যাব */
    .input-group { margin-bottom: 14px; }
    .input-group label { display: block; color: #cbd5e1; font-size: 0.8rem; margin-bottom: 4px; }
    .input-group input, .input-group select { width: 100%; padding: 10px 14px; border-radius: 24px; border: 1px solid #1e293b; background: #0f172a; color: white; font-size: 0.9rem; outline: none; }
    .input-group input:focus { border-color: #3b82f6; }
    .calc-submit { background: #10b981; color: white; border: none; padding: 10px 18px; border-radius: 40px; font-weight: bold; width: 100%; margin-top: 8px; cursor: pointer; }
    .result-box { background: #0f172a; padding: 12px; border-radius: 20px; margin-top: 16px; text-align: center; color: #38bdf8; font-weight: bold; font-size: 0.9rem; }
    .unit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px,1fr)); gap: 8px; background: #0f172a; padding: 12px; border-radius: 20px; margin-top: 12px; }
    .unit-item { background: #1e293b; padding: 6px; border-radius: 16px; text-align: center; color: #e2e8f0; font-size: 0.7rem; }
    .unit-item span:first-child { font-weight: bold; color: #38bdf8; display: block; }
    @media (max-width: 480px) {
      .super-calc { padding: 14px; }
      button { padding: 10px 0; font-size: 1rem; }
      .result { font-size: 1.6rem; }
      .expression { font-size: 1.4rem; }
      .tab-btn { padding: 4px 8px; font-size: 0.65rem; }
    }
  </style>
</head>
<body>
<div class="super-calc">
  <div class="tabs">
    <button class="tab-btn active" data-tab="basic">🧮 ক্যালকুলেটর</button>
    <button class="tab-btn" data-tab="trig">📐 ত্রিকোণমিতি</button>
    <button class="tab-btn" data-tab="geometry">📏 পরিমিতি</button>
    <button class="tab-btn" data-tab="unitLength">📏 দৈর্ঘ্য</button>
    <button class="tab-btn" data-tab="unitVolume">🧴 আয়তন</button>
    <button class="tab-btn" data-tab="unitTemp">🌡️ তাপমাত্রা</button>
    <button class="tab-btn" data-tab="weight">⚖️ ওজন</button>
    <button class="tab-btn" data-tab="flower">🌻 ফুল বাজার</button>
    <button class="tab-btn" data-tab="emi">💰 ইএমআই</button>
    <button class="tab-btn" data-tab="bmi">⚖️ বিএমআই</button>
  </div>

  <!-- প্রধান ক্যালকুলেটর প্যানেল -->
  <div id="basic" class="tab-pane active-pane">
    <div class="calc-display">
      <div class="term-counter" id="termCounter">👉 0</div>
      <div class="expression" id="exprDisplay">0</div>
      <div class="result" id="decimalResult">= 0</div>
      <div class="fraction-result" id="fractionResult">ভগ্নাংশ: —</div>
    </div>

    <div class="buttons">
      <!-- সারি 1 -->
      <button class="bracket-btn" data-char="(">(</button>
      <button class="bracket-btn" data-char=")">)</button>
      <button class="bracket-btn" data-char="{">{</button>
      <button class="bracket-btn" data-char="}">}</button>
      <button class="clear-btn" id="clearBtn">AC</button>

      <!-- সারি 2 -->
      <button class="bracket-btn" data-char="[">[</button>
      <button class="bracket-btn" data-char="]">]</button>
      <button class="sqrt-btn" id="sqrtBtn">√</button>
      <button class="square-btn" id="squareBtn">x²</button>
      <button class="del-btn" id="delBtn">⌫</button>

      <!-- সারি 3 -->
      <button class="num-btn" data-char="7">7</button>
      <button class="num-btn" data-char="8">8</button>
      <button class="num-btn" data-char="9">9</button>
      <button class="percent-btn" id="percentBtn">%</button>
      <button class="op-btn" id="divideBtn">÷</button>

      <!-- সারি 4 -->
      <button class="num-btn" data-char="4">4</button>
      <button class="num-btn" data-char="5">5</button>
      <button class="num-btn" data-char="6">6</button>
      <div style="grid-column: 4; grid-row: 4 / span 2;" class="large-plus" id="largePlusBtn">+</div>
      <button class="op-btn" id="multiplyBtn">×</button>

      <!-- সারি 5 -->
      <button class="num-btn" data-char="1">1</button>
      <button class="num-btn" data-char="2">2</button>
      <button class="num-btn" data-char="3">3</button>
      <button class="op-btn" id="minusBtn">-</button>

      <!-- সারি 6 -->
      <button class="num-btn" data-char="00">00</button>
      <button class="num-btn" data-char="0">0</button>
      <button class="num-btn" data-char=".">.</button>
      <button class="eq-btn" id="equalBtn">=</button>
    </div>
    <div style="font-size:0.7rem; text-align:center; margin-top:14px; color:#64748b;">⌨️ কিবোর্ড সাপোর্ট | ( ) { } [ ] | √ বর্গমূল | x² বর্গ</div>
  </div>

  <!-- অন্যান্য ট্যাব (পূর্ণ কার্যকারিতা সহ) -->
  <div id="trig" class="tab-pane"> <div class="input-group"><label>কোণ (ডিগ্রি)</label><input type="number" id="angleDeg" step="any" placeholder="0"></div> <div style="display:grid; grid-template-columns:1fr 1fr; gap:8px;"><button class="calc-submit" id="sinBtn">sin</button><button class="calc-submit" id="cosBtn">cos</button><button class="calc-submit" id="tanBtn">tan</button><button class="calc-submit" id="asinBtn">sin⁻¹</button><button class="calc-submit" id="acosBtn">cos⁻¹</button><button class="calc-submit" id="atanBtn">tan⁻¹</button></div> <div class="result-box" id="trigResultDecimal">দশমিক: --</div><div class="result-box" id="trigResultFraction">ভগ্নাংশ: --</div> </div>
  <div id="geometry" class="tab-pane"> <div class="input-group"><label>আকৃতি</label><select id="shape"><option value="square">বর্গ</option><option value="rectangle">আয়তক্ষেত্র</option><option value="circle">বৃত্ত</option><option value="cube">ঘনক</option><option value="cuboid">আয়তঘন</option><option value="sphere">গোলক</option><option value="right_triangle">সমকোণী ত্রিভুজ</option><option value="scalene_triangle">বিষমবাহু ত্রিভুজ</option></select></div> <div id="shapeInputs"></div><button class="calc-submit" id="calcShapeBtn">হিসাব</button><div class="result-box" id="geometryResult">ফলাফল</div> </div>
  <div id="unitLength" class="tab-pane"> <div class="input-group"><label>মান</label><input type="number" id="lengthValue" step="any" placeholder="0"></div> <div class="input-group"><label>একক</label><select id="lengthUnit"><option value="m">মিটার</option><option value="cm">সেমি</option><option value="mm">মিমি</option><option value="km">কিমি</option><option value="in">ইঞ্চি</option><option value="ft">ফুট</option><option value="yd">গজ</option></select></div> <button class="calc-submit" id="convertLengthBtn">কনভার্ট</button><div id="lengthResults" class="unit-grid"></div> </div>
  <div id="unitVolume" class="tab-pane"> <div class="input-group"><label>মান</label><input type="number" id="volumeValue" step="any" placeholder="0"></div> <div class="input-group"><label>একক</label><select id="volumeUnit"><option value="l">লিটার</option><option value="ml">মিলিলিটার</option><option value="m3">ঘনমিটার</option><option value="gal">গ্যালন</option></select></div> <button class="calc-submit" id="convertVolumeBtn">কনভার্ট</button><div id="volumeResults" class="unit-grid"></div> </div>
  <div id="unitTemp" class="tab-pane"> <div class="input-group"><label>মান</label><input type="number" id="tempValue" step="any" placeholder="0"></div> <div class="input-group"><label>একক</label><select id="tempUnit"><option value="c">সেলসিয়াস</option><option value="f">ফারেনহাইট</option><option value="k">কেলভিন</option></select></div> <button class="calc-submit" id="convertTempBtn">কনভার্ট</button><div id="tempResults" class="unit-grid"></div> </div>
  <div id="weight" class="tab-pane"> <div class="input-group"><label>মান</label><input type="number" id="weightVal" step="any" placeholder="0"></div> <div class="input-group"><label>একক</label><select id="weightUnit"><option value="kg">কেজি</option><option value="g">গ্রাম</option><option value="lb">পাউন্ড</option><option value="oz">আউন্স</option><option value="t">টন</option><option value="mt">মেট্রিক টন</option></select></div> <button class="calc-submit" id="convertWeightBtn">কনভার্ট</button><div id="weightResults" class="unit-grid"></div> </div>
  <div id="flower" class="tab-pane"> <div class="input-group"><label>মোট ওজন (কেজি)</label><input type="number" id="flowerTotal" step="any" placeholder="0"></div> <div class="input-group"><label>ব্যাগ ওজন (কেজি)</label><input type="number" id="flowerBag" step="any" placeholder="0"></div> <div class="input-group"><label>বর্জ্য (কেজি)</label><input type="number" id="flowerWaste" step="any" placeholder="0"></div> <div class="input-group"><label>দাম/কেজি (টাকা)</label><input type="number" id="flowerPrice" step="any" placeholder="0"></div> <button class="calc-submit" id="flowerBtn">হিসাব</button><div class="result-box" id="flowerResult"></div> </div>
  <div id="emi" class="tab-pane"> <div class="input-group"><label>মূলধন (টাকা)</label><input type="number" id="emiPrincipal" step="any" placeholder="0"></div> <div class="input-group"><label>বার্ষিক সুদ (%)</label><input type="number" id="emiRate" step="any" placeholder="0"></div> <div class="input-group"><label>সময় (মাস)</label><input type="number" id="emiMonths" step="any" placeholder="1"></div> <button class="calc-submit" id="emiBtn">গণনা</button><div class="result-box" id="emiResult"></div> </div>
  <div id="bmi" class="tab-pane"> <div class="input-group"><label>উচ্চতা (সেমি)</label><input type="number" id="bmiHeight" step="any" placeholder="0"></div> <div class="input-group"><label>ওজন (কেজি)</label><input type="number" id="bmiWeight" step="any" placeholder="0"></div> <button class="calc-submit" id="bmiBtn">BMI</button><div class="result-box" id="bmiResult"></div> </div>
</div>

<script>
  // ট্যাব সিস্টেম
  const tabs = document.querySelectorAll('.tab-btn');
  const panes = document.querySelectorAll('.tab-pane');
  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      const tabId = btn.getAttribute('data-tab');
      panes.forEach(p => p.classList.remove('active-pane'));
      document.getElementById(tabId).classList.add('active-pane');
      tabs.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  // ক্যালকুলেটর লজিক (ডুপ্লিকেট ডিসপ্লে বাদ)
  let currentExpression = '';
  let resetOnNextInput = false;

  const exprSpan = document.getElementById('exprDisplay');
  const resultSpan = document.getElementById('decimalResult');
  const fractionSpan = document.getElementById('fractionResult');
  const termCounterSpan = document.getElementById('termCounter');

  function formatDisplay(expr) { return expr.replace(/\*/g, '×').replace(/\//g, '÷'); }

  function decimalToFraction(decimal, tolerance = 1e-6) {
    if (isNaN(decimal) || !isFinite(decimal)) return decimal.toString();
    if (Math.abs(decimal - Math.round(decimal)) < tolerance) return Math.round(decimal).toString();
    let sign = decimal < 0 ? -1 : 1;
    let absVal = Math.abs(decimal);
    let bestNum = 1, bestDen = 1, bestDiff = Math.abs(absVal - 1);
    for (let den = 1; den <= 1000; den++) {
      let num = Math.round(absVal * den);
      let diff = Math.abs(absVal - num / den);
      if (diff < bestDiff) { bestDiff = diff; bestNum = num; bestDen = den; if (bestDiff < tolerance) break; }
    }
    let finalNum = sign * bestNum;
    let finalDen = bestDen;
    const gcd = (a,b) => b ? gcd(b, a%b) : a;
    let g = gcd(Math.abs(finalNum), finalDen);
    finalNum /= g; finalDen /= g;
    if (finalDen === 1) return finalNum.toString();
    return `${finalNum}/${finalDen}`;
  }

  function safeEval(expr) {
    try {
      let result = Function('"use strict";return (' + expr + ')')();
      if (isNaN(result) || !isFinite(result)) throw new Error();
      return result;
    } catch(e) { return null; }
  }

  function countTerms(expr) {
    let terms = expr.split(/[\+\-\*\/]/).filter(t => t.trim() !== '' && !/^[\(\)\[\]\{\}]+$/.test(t));
    return terms.length;
  }

  function updateDisplay() {
    if (!currentExpression.trim()) {
      exprSpan.innerText = '0';
      resultSpan.innerText = '= 0';
      fractionSpan.innerText = 'ভগ্নাংশ: —';
      termCounterSpan.innerText = '👉 0';
      return;
    }
    let res = safeEval(currentExpression);
    if (res !== null) {
      let decimalShow = res % 1 === 0 ? res : res.toFixed(8).replace(/\.?0+$/, '');
      resultSpan.innerText = `= ${decimalShow}`;
      fractionSpan.innerText = `ভগ্নাংশ: ${decimalToFraction(res)}`;
      let terms = countTerms(currentExpression);
      termCounterSpan.innerText = `👉 ${terms}`;
    } else {
      resultSpan.innerText = '= ত্রুটি';
      fractionSpan.innerText = 'ভগ্নাংশ: —';
      termCounterSpan.innerText = '👉 ?';
    }
    exprSpan.innerText = formatDisplay(currentExpression);
  }

  function addChar(ch) {
    if (resetOnNextInput && /[\d\.]/.test(ch)) {
      currentExpression = '';
      resetOnNextInput = false;
    }
    currentExpression += ch;
    updateDisplay();
  }

  function addOperator(op) {
    if (resetOnNextInput) resetOnNextInput = false;
    if (currentExpression && !/[\+\-\*\/]$/.test(currentExpression)) {
      currentExpression += op;
      updateDisplay();
    } else if (currentExpression === '') return;
    else {
      currentExpression = currentExpression.slice(0, -1) + op;
      updateDisplay();
    }
  }

  function clearAll() { currentExpression = ''; resetOnNextInput = false; updateDisplay(); }
  function deleteLast() { if (!resetOnNextInput) { currentExpression = currentExpression.slice(0, -1); updateDisplay(); } }
  function sqrt() {
    let res = safeEval(currentExpression);
    if (res !== null && res >= 0) { currentExpression = Math.sqrt(res).toString(); resetOnNextInput = false; updateDisplay(); }
    else { currentExpression = 'Error'; updateDisplay(); setTimeout(clearAll, 1000); }
  }
  function square() {
    let res = safeEval(currentExpression);
    if (res !== null) { currentExpression = (res * res).toString(); resetOnNextInput = false; updateDisplay(); }
    else { currentExpression = 'Error'; updateDisplay(); setTimeout(clearAll, 1000); }
  }
  function percent() {
    let res = safeEval(currentExpression);
    if (res !== null) { currentExpression = (res / 100).toString(); resetOnNextInput = false; updateDisplay(); }
  }
  function equal() {
    let res = safeEval(currentExpression);
    if (res !== null) { currentExpression = res.toString(); resetOnNextInput = true; updateDisplay(); }
    else resultSpan.innerText = '= ত্রুটি';
  }

  // বাটন ইভেন্ট
  document.querySelectorAll('#basic .num-btn[data-char], #basic .bracket-btn[data-char]').forEach(btn => {
    btn.addEventListener('click', () => { let ch = btn.getAttribute('data-char'); if(ch) addChar(ch); });
  });
  document.getElementById('clearBtn').addEventListener('click', clearAll);
  document.getElementById('delBtn').addEventListener('click', deleteLast);
  document.getElementById('sqrtBtn').addEventListener('click', sqrt);
  document.getElementById('squareBtn').addEventListener('click', square);
  document.getElementById('percentBtn').addEventListener('click', percent);
  document.getElementById('equalBtn').addEventListener('click', equal);
  document.getElementById('minusBtn').addEventListener('click', () => addOperator('-'));
  document.getElementById('multiplyBtn').addEventListener('click', () => addOperator('*'));
  document.getElementById('divideBtn').addEventListener('click', () => addOperator('/'));
  document.getElementById('largePlusBtn').addEventListener('click', () => addOperator('+'));

  document.addEventListener('keydown', (e) => {
    if (document.getElementById('basic').classList.contains('active-pane')) {
      const key = e.key;
      if (/[\d\+\-\*\/\.\(\)\[\]\{\}]/.test(key)) {
        e.preventDefault();
        if (key === '+' || key === '-' || key === '*' || key === '/') addOperator(key);
        else addChar(key);
      } else if (key === 'Enter') { e.preventDefault(); equal(); }
      else if (key === 'Backspace') { e.preventDefault(); deleteLast(); }
      else if (key === 'Delete' || key === 'Escape') { e.preventDefault(); clearAll(); }
    }
  });
  updateDisplay();

  // অন্যান্য ট্যাবের কার্যকারিতা (সংক্ষেপে, পূর্বের মতো কাজ করবে)
  // ত্রিকোণমিতি
  const angleDeg = document.getElementById('angleDeg');
  if (angleDeg) {
    const trigFns = {
      sin: (d) => Math.sin(d * Math.PI / 180),
      cos: (d) => Math.cos(d * Math.PI / 180),
      tan: (d) => Math.tan(d * Math.PI / 180),
      asin: (d) => Math.asin(Math.min(1, Math.max(-1, d))) * 180 / Math.PI,
      acos: (d) => Math.acos(Math.min(1, Math.max(-1, d))) * 180 / Math.PI,
      atan: (d) => Math.atan(d) * 180 / Math.PI
    };
    for (let [op, fn] of Object.entries(trigFns)) {
      document.getElementById(`${op}Btn`)?.addEventListener('click', () => {
        let deg = parseFloat(angleDeg.value) || 0;
        let res = fn(deg);
        document.getElementById('trigResultDecimal').innerHTML = `দশমিক: ${res.toFixed(8)}`;
        document.getElementById('trigResultFraction').innerHTML = `ভগ্নাংশ: ${decimalToFraction(res)}`;
      });
    }
  }
  // পরিমিতি
  const shapeSelect = document.getElementById('shape');
  const shapeInputsDiv = document.getElementById('shapeInputs');
  function updateShapeInputs() {
    if (!shapeSelect) return;
    const shape = shapeSelect.value;
    let html = '';
    if (shape === 'square') html = '<div class="input-group"><label>বাহু বা কর্ণ</label><input id="squareSide" placeholder="বাহু"><input id="squareDiagonal" placeholder="কর্ণ"></div>';
    else if (shape === 'rectangle') html = '<div class="input-group"><label>দৈর্ঘ্য ও প্রস্থ</label><input id="rectL" placeholder="l"><input id="rectW" placeholder="w"></div>';
    else if (shape === 'circle') html = '<div class="input-group"><label>ব্যাসার্ধ বা ব্যাস</label><input id="circleR" placeholder="r"><input id="circleD" placeholder="d"></div>';
    else if (shape === 'cube') html = '<div class="input-group"><label>বাহু বা কর্ণ</label><input id="cubeSide" placeholder="a"><input id="cubeDiagonal" placeholder="d"></div>';
    else if (shape === 'cuboid') html = '<div class="input-group"><label>l,w,h</label><input id="cubL" placeholder="l"><input id="cubW" placeholder="w"><input id="cubH" placeholder="h"></div>';
    else if (shape === 'sphere') html = '<div class="input-group"><label>ব্যাসার্ধ বা ব্যাস</label><input id="sphereR" placeholder="r"><input id="sphereD" placeholder="d"></div>';
    else if (shape === 'right_triangle') html = '<div class="input-group"><label>ভূমি, লম্ব, অতিভুজ</label><input id="triBase" placeholder="b"><input id="triPerp" placeholder="p"><input id="triHyp" placeholder="h"></div>';
    else if (shape === 'scalene_triangle') html = '<div class="input-group"><label>তিন বাহু a,b,c</label><input id="scaA" placeholder="a"><input id="scaB" placeholder="b"><input id="scaC" placeholder="c"></div>';
    shapeInputsDiv.innerHTML = html;
  }
  if (shapeSelect) shapeSelect.addEventListener('change', updateShapeInputs);
  updateShapeInputs();
  document.getElementById('calcShapeBtn')?.addEventListener('click', () => {
    const shape = shapeSelect.value;
    let result = '';
    if (shape === 'square') {
      let a = parseFloat(document.getElementById('squareSide')?.value) || 0, d = parseFloat(document.getElementById('squareDiagonal')?.value) || 0;
      if (a > 0) result = `ক্ষেত্রফল: ${(a * a).toFixed(4)}, কর্ণ: ${(a * Math.sqrt(2)).toFixed(4)}`;
      else if (d > 0) { let side = d / Math.sqrt(2); result = `বাহু: ${side.toFixed(4)}, ক্ষেত্রফল: ${(side * side).toFixed(4)}`; }
      else result = 'একটি মান দিন';
    } else if (shape === 'rectangle') {
      let l = parseFloat(document.getElementById('rectL')?.value) || 0, w = parseFloat(document.getElementById('rectW')?.value) || 0;
      result = `ক্ষেত্রফল: ${(l * w).toFixed(4)}, পরিসীমা: ${(2 * (l + w)).toFixed(4)}`;
    } else if (shape === 'circle') {
      let r = parseFloat(document.getElementById('circleR')?.value) || 0, d = parseFloat(document.getElementById('circleD')?.value) || 0;
      if (r > 0) result = `ক্ষেত্রফল: ${(Math.PI * r * r).toFixed(4)}, পরিধি: ${(2 * Math.PI * r).toFixed(4)}`;
      else if (d > 0) { let rad = d / 2; result = `ব্যাসার্ধ: ${rad.toFixed(4)}, ক্ষেত্রফল: ${(Math.PI * rad * rad).toFixed(4)}`; }
      else result = 'ব্যাসার্ধ বা ব্যাস দিন';
    } else if (shape === 'cube') {
      let a = parseFloat(document.getElementById('cubeSide')?.value) || 0, d = parseFloat(document.getElementById('cubeDiagonal')?.value) || 0;
      if (a > 0) result = `আয়তন: ${(a * a * a).toFixed(4)}, কর্ণ: ${(a * Math.sqrt(3)).toFixed(4)}`;
      else if (d > 0) { let side = d / Math.sqrt(3); result = `বাহু: ${side.toFixed(4)}, আয়তন: ${(side * side * side).toFixed(4)}`; }
      else result = 'বাহু বা কর্ণ দিন';
    } else if (shape === 'cuboid') {
      let l = parseFloat(document.getElementById('cubL')?.value) || 0, w = parseFloat(document.getElementById('cubW')?.value) || 0, h = parseFloat(document.getElementById('cubH')?.value) || 0;
      result = `আয়তন: ${(l * w * h).toFixed(4)}, পৃষ্ঠতল: ${(2 * (l * w + w * h + h * l)).toFixed(4)}`;
    } else if (shape === 'sphere') {
      let r = parseFloat(document.getElementById('sphereR')?.value) || 0, d = parseFloat(document.getElementById('sphereD')?.value) || 0;
      if (r > 0) result = `আয়তন: ${((4 / 3) * Math.PI * r * r * r).toFixed(4)}, পৃষ্ঠতল: ${(4 * Math.PI * r * r).toFixed(4)}`;
      else if (d > 0) { let rad = d / 2; result = `ব্যাসার্ধ: ${rad.toFixed(4)}, আয়তন: ${((4 / 3) * Math.PI * rad * rad * rad).toFixed(4)}`; }
      else result = 'ব্যাসার্ধ বা ব্যাস দিন';
    } else if (shape === 'right_triangle') {
      let b = parseFloat(document.getElementById('triBase')?.value) || 0, p = parseFloat(document.getElementById('triPerp')?.value) || 0, h = parseFloat(document.getElementById('triHyp')?.value) || 0;
      if (b > 0 && p > 0) result = `অতিভুজ: ${(Math.sqrt(b * b + p * p)).toFixed(4)}, ক্ষেত্রফল: ${(0.5 * b * p).toFixed(4)}`;
      else if (b > 0 && h > 0) { let perp = Math.sqrt(h * h - b * b); if (!isNaN(perp)) result = `লম্ব: ${perp.toFixed(4)}, ক্ষেত্রফল: ${(0.5 * b * perp).toFixed(4)}`; else result = 'অসম্ভব'; }
      else if (p > 0 && h > 0) { let base = Math.sqrt(h * h - p * p); if (!isNaN(base)) result = `ভূমি: ${base.toFixed(4)}, ক্ষেত্রফল: ${(0.5 * base * p).toFixed(4)}`; else result = 'অসম্ভব'; }
      else result = 'কমপক্ষে দুইটি মান দিন';
    } else if (shape === 'scalene_triangle') {
      let a = parseFloat(document.getElementById('scaA')?.value) || 0, b = parseFloat(document.getElementById('scaB')?.value) || 0, c = parseFloat(document.getElementById('scaC')?.value) || 0;
      if (a + b > c && b + c > a && c + a > b) { let s = (a + b + c) / 2; let area = Math.sqrt(s * (s - a) * (s - b) * (s - c)); result = `ক্ষেত্রফল: ${area.toFixed(4)}`; }
      else result = 'ত্রিভুজ সম্ভব নয়';
    }
    document.getElementById('geometryResult').innerHTML = result;
  });
  // ইউনিট কনভার্টার (দৈর্ঘ্য)
  const lengthMap = { m: 1, cm: 0.01, mm: 0.001, km: 1000, in: 0.0254, ft: 0.3048, yd: 0.9144 };
  document.getElementById('convertLengthBtn')?.addEventListener('click', () => {
    let val = parseFloat(document.getElementById('lengthValue').value) || 0;
    let from = document.getElementById('lengthUnit').value;
    let meters = val * lengthMap[from];
    const container = document.getElementById('lengthResults');
    container.innerHTML = '';
    for (let [unit, factor] of Object.entries(lengthMap)) {
      let converted = meters / factor;
      let name = { m: 'মিটার', cm: 'সেমি', mm: 'মিমি', km: 'কিমি', in: 'ইঞ্চি', ft: 'ফুট', yd: 'গজ' }[unit];
      container.innerHTML += `<div class="unit-item"><span>${name}</span><span>${converted.toFixed(6)}</span></div>`;
    }
  });
  // আয়তন, তাপমাত্রা, ওজন কনভার্টার (সংক্ষেপে, আগের মতো)
  const volumeMap = { l: 1, ml: 0.001, m3: 1000, gal: 3.78541 };
  document.getElementById('convertVolumeBtn')?.addEventListener('click', () => {
    let val = parseFloat(document.getElementById('volumeValue').value) || 0;
    let from = document.getElementById('volumeUnit').value;
    let liters = val * volumeMap[from];
    const container = document.getElementById('volumeResults');
    container.innerHTML = '';
    for (let [unit, factor] of Object.entries(volumeMap)) {
      let converted = liters / factor;
      let name = { l: 'লিটার', ml: 'মিলিলিটার', m3: 'ঘনমিটার', gal: 'গ্যালন' }[unit];
      container.innerHTML += `<div class="unit-item"><span>${name}</span><span>${converted.toFixed(6)}</span></div>`;
    }
  });
  document.getElementById('convertTempBtn')?.addEventListener('click', () => {
    let val = parseFloat(document.getElementById('tempValue').value) || 0;
    let from = document.getElementById('tempUnit').value;
    let celsius;
    if (from === 'c') celsius = val;
    else if (from === 'f') celsius = (val - 32) * 5 / 9;
    else celsius = val - 273.15;
    const container = document.getElementById('tempResults');
    container.innerHTML = `<div class="unit-item"><span>সেলসিয়াস</span><span>${celsius.toFixed(4)} °C</span></div>
                           <div class="unit-item"><span>ফারেনহাইট</span><span>${(celsius * 9 / 5 + 32).toFixed(4)} °F</span></div>
                           <div class="unit-item"><span>কেলভিন</span><span>${(celsius + 273.15).toFixed(4)} K</span></div>`;
  });
  const weightMap = { kg: 1, g: 0.001, lb: 0.453592, oz: 0.0283495, t: 1000, mt: 1000 };
  document.getElementById('convertWeightBtn')?.addEventListener('click', () => {
    let val = parseFloat(document.getElementById('weightVal').value) || 0;
    let from = document.getElementById('weightUnit').value;
    let kgs = val * weightMap[from];
    const container = document.getElementById('weightResults');
    container.innerHTML = '';
    for (let [unit, factor] of Object.entries(weightMap)) {
      let converted = kgs / factor;
      let name = { kg: 'কেজি', g: 'গ্রাম', lb: 'পাউন্ড', oz: 'আউন্স', t: 'টন', mt: 'মেট্রিক টন' }[unit];
      container.innerHTML += `<div class="unit-item"><span>${name}</span><span>${converted.toFixed(6)}</span></div>`;
    }
  });
  // ফুল বাজার
  document.getElementById('flowerBtn')?.addEventListener('click', () => {
    let total = parseFloat(document.getElementById('flowerTotal').value) || 0;
    let bag = parseFloat(document.getElementById('flowerBag').value) || 0;
    let waste = parseFloat(document.getElementById('flowerWaste').value) || 0;
    let price = parseFloat(document.getElementById('flowerPrice').value) || 0;
    let net = Math.max(0, total - bag - waste);
    document.getElementById('flowerResult').innerHTML = `পাকা ওজন: ${net.toFixed(2)} কেজি<br>মোট দাম: ${(net * price).toFixed(2)} টাকা`;
  });
  // ইএমআই
  document.getElementById('emiBtn')?.addEventListener('click', () => {
    let P = parseFloat(document.getElementById('emiPrincipal').value) || 0;
    let r = parseFloat(document.getElementById('emiRate').value) || 0;
    let n = parseFloat(document.getElementById('emiMonths').value) || 1;
    if (P && r && n) {
      let monthlyRate = r / 12 / 100;
      let emi = P * monthlyRate * Math.pow(1 + monthlyRate, n) / (Math.pow(1 + monthlyRate, n) - 1);
      let totalPayment = emi * n;
      let totalInterest = totalPayment - P;
      document.getElementById('emiResult').innerHTML = `ইএমআই: ${emi.toFixed(2)} টাকা/মাস<br>মোট সুদ: ${totalInterest.toFixed(2)} টাকা<br>মোট পরিশোধ: ${totalPayment.toFixed(2)} টাকা`;
    } else document.getElementById('emiResult').innerHTML = 'সঠিক মান দিন';
  });
  // বিএমআই
  document.getElementById('bmiBtn')?.addEventListener('click', () => {
    let h = parseFloat(document.getElementById('bmiHeight').value) || 0;
    let w = parseFloat(document.getElementById('bmiWeight').value) || 0;
    if (h > 0 && w > 0) {
      let bmi = w / ((h / 100) ** 2);
      let msg = bmi < 18.5 ? 'ওজন কম' : bmi < 25 ? 'স্বাভাবিক' : bmi < 30 ? 'ওজন বেশি' : 'মোটা';
      document.getElementById('bmiResult').innerHTML = `BMI: ${bmi.toFixed(2)} (${msg})`;
    } else document.getElementById('bmiResult').innerHTML = 'সঠিক উচ্চতা ও ওজন দিন';
  });
</script>
</body>
</html>
