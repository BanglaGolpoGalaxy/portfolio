name: Generate Sitemap

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Generate sitemap
        run: python .github/scripts/generate_sitemap.py

      - name: Commit updated sitemap
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap.xml
          git diff --staged --quiet || (git commit -m "🤖 অটো-জেনারেটেড সাইটম্যাপ" && git push)

      - name: Ping Google
        run: curl -s "https://www.google.com/ping?sitemap=https://banglagolpogalaxy.github.io/portfolio/sitemap.xml"
