name: Generate Sitemap & Inject Series

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # ---------- ইনজেকশন স্ক্রিপ্ট রান (ব্লগ টেবিল + সাইটম্যাপ লিংক) ----------
      - name: Run inject_series.sh
        run: |
          chmod +x inject_series.sh
          ./inject_series.sh

      # ---------- ইনজেকশনের পরিবর্তন কমিট ----------
      - name: Commit injected changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --staged --quiet; then
            echo "✅ কোনো পরিবর্তন নেই"
          else
            git commit -m "🔧 ইনজেকশন রোবট: ব্লগ টেবিল ও সাইটম্যাপ লিংক যোগ"
            git push
          fi

      # ---------- সাইটম্যাপ জেনারেট (Python) ----------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate sitemap
        run: python .github/scripts/generate_sitemap.py

      # ---------- সাইটম্যাপ ফাইলের নাম পরিবর্তন ----------
      - name: Rename sitemap to new name
        run: |
          if [ -f sitemap.xml ]; then
            mv sitemap.xml sitemap_new.xml
            echo "✅ সাইটম্যাপের নাম পরিবর্তন করা হয়েছে"
          else
            echo "⚠️ sitemap.xml পাওয়া যায়নি"
          fi

      # ---------- আপডেটেড সাইটম্যাপ কমিট ----------
      - name: Commit updated sitemap
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add sitemap_new.xml sitemap.html
          if git diff --staged --quiet; then
            echo "✅ সাইটম্যাপে কোনো পরিবর্তন নেই"
          else
            git commit -m "🤖 অটো-জেনারেটেড সাইটম্যাপ (নতুন নাম)"
            git push
          fi
